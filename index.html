<html lang="en">

<!-- Tailwind Config -->
<script>
tailwind = {

<script src="https://cdn.tailwindcss.com"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: system-ui, -apple-system; background: linear-gradient(135deg, #e6f5ec 0%, #d1fae5 100%); }
header { background: linear-gradient(to right, #b91c1c, #f87171); color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

  header, .no-print { display: none !important; }
  body { background: white; }
  .bin-card { page-break-inside: avoid; border: 1px solid #000; }
}

</head>
<body class="min-h-screen">

<header class="border-b py-4 bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-6 flex flex-wrap justify-between items-center gap-4">

    <!-- LEFT SIDE: Logo + Title -->
    <div class="flex items-center gap-4">

      <!-- LOGO SPACE -->
      <img src="icon-192.png" alt="MCODES EXPIIRY"
        class="w-12 h-12 object-contain rounded-lg border">

      <!-- TITLE -->
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-gray-800">
          EXPIRY STOCK REGISTER
        </h1>
        <p class="text-sm text-gray-500">
          Inventory Expiry Monitoring
        </p>
      </div>

    </div>

    <!-- RIGHT SIDE: ACTION BUTTONS -->
    <div class="flex flex-wrap gap-3 items-center no-print">

      <!-- Print -->
      <button onclick="window.print()"
        class="bg-green-600 text-white px-4 py-2 rounded shadow font-semibold hover:bg-green-700 transition">
        Print
      </button>

      <!-- Dashboard -->
      <a href="index.html"
        class="underline font-medium text-gray-700 hover:text-green-600 transition">

      </a>

      <!-- Subscribe -->
      <button id="subscribeBtn"
        class="bg-green-600 text-white px-4 py-2 rounded shadow font-semibold hover:bg-green-700 transition">
        Subscribe ₦5,000/Month
      </button>

      <!-- Logout -->
      <button id="logoutBtn"
        class="bg-red-600 text-white px-4 py-2 rounded shadow font-semibold hover:bg-red-700 transition">

      </button>

    </div>

  </div>
</header>
<main class="max-w-7xl mx-auto px-6 py-8">

<!-- Record Stock -->
<section class="bg-white border rounded-xl mb-6 shadow-lg p-5 no-print">
  <div class="border-b border-gray-200 pb-3 mb-3">
    <h2 class="text-xl font-bold text-green-700">Record New Stock</h2>
    <p class="text-sm text-gray-500">Enter stock details as labeled</p>
  </div>
  <form id="stockForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
    <input id="name" required placeholder="Stock Name" class="border px-3 py-2 rounded text-sm shadow-sm">
    <input id="qty" type="number" required placeholder="Qty" class="border px-3 py-2 rounded text-sm shadow-sm">
    <input id="batch" placeholder="Batch No" class="border px-3 py-2 rounded text-sm shadow-sm">
    <input id="expiry" type="date" required class="border px-3 py-2 rounded text-sm shadow-sm">
    <button type="submit" class="bg-green-600 text-white rounded text-sm font-semibold shadow hover:bg-green-700">Save Record</button>
  </form>
  <p id="successMsg" class="text-green-600 text-sm mt-2 hidden">✅ Stock added successfully!</p>
</section>

<!-- Search -->
<section class="mb-6">
  <input type="text" id="searchInput" placeholder="Search stocks..." class="w-full border px-3 py-2 rounded text-sm shadow-sm focus:ring-1 focus:ring-green-600">
</section>

<!-- Stock Summary -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 text-center">
  <div class="bg-white border rounded-xl p-6 shadow hover:scale-105 transition-transform">
    <p class="text-xs text-gray-500">TOTAL ITEMS</p>
    <p id="totalStocks" class="text-3xl font-bold text-green-700">0</p>
  </div>
  <div class="bg-yellow-50 border border-yellow-300 rounded-xl p-6 shadow hover:scale-105 transition-transform">
    <p class="text-xs">NEAR EXPIRY</p>
    <p id="nearExpiry" class="text-3xl font-bold text-yellow-700">0</p>
  </div>
  <div class="bg-red-50 border border-red-300 rounded-xl p-6 shadow hover:scale-105 transition-transform">
    <p class="text-xs">EXPIRED</p>
    <p id="expired" class="text-3xl font-bold text-red-700">0</p>
  </div>
</section>

<!-- Chart -->
<section class="bg-white dark:bg-gray-700 border rounded-xl mb-6 shadow-lg p-5">
  <h2 class="text-xl font-bold text-green-700 dark:text-green-400 mb-4">Stock Status Chart</h2>
  <canvas id="stockChart" class="w-full h-64"></canvas>
</section>

<!-- Stock Records -->
<section>
  <h2 class="text-xl font-bold mb-4 text-green-700">Stock Records</h2>
  <div id="cards" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  <div id="empty" class="text-center py-12 text-gray-500 hidden">No near-expiry or expired stocks</div>
  <label class="text-sm font-semibold">Near expiry threshold (days)</label>
  <input type="number" id="nearDaysInput" value="7" class="border px-2 py-1 rounded text-sm">
</section>

</main>

<audio id="alertSound">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>
<section class="bg-white dark:bg-gray-700 border rounded-xl mb-6 shadow-lg p-5">
  <button id="installBtn"
  class="fixed bottom-4 right-4 bg-red-600 text-white px-4 py-2 rounded-lg hidden">Click here to
  Install App
</button>
</section>
<div id="offlineBanner"
 class="hidden fixed top-0 left-0 w-full bg-red-600 text-white text-center p-2 z-50">
 You are offline. Some features may not work.
</div>
<script type="module">
/* ===============================
   FIREBASE IMPORTS
================================ */

// Core
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

// Database
import {
  getDatabase,
  ref,
  push,
  onValue,
  update,
  remove,
  get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// Auth
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* ===============================
   LOGOUT LOGIC
================================ */

const logoutBtn = document.getElementById("logoutBtn");

if (logoutBtn) {
  logoutBtn.addEventListener("click", async () => {
    const confirmLogout = confirm("Are you sure you want to logout?");
    if (!confirmLogout) return;
    
    try {
      await signOut(auth);
      window.location.href = "firebase login.html";
    } catch (error) {
      console.error("Logout error:", error);
      alert("Error logging out. Please try again.");
    }
  });
}
/* ===============================
   FIREBASE CONFIG (IMPORTANT)
================================ */
const firebaseConfig = {
  apiKey: "AIzaSyD7ty4-tgDn3iQNchRmCDn7lO14kgem10o",
  authDomain: "mcode-expiring.firebaseapp.com",
  databaseURL: "https://mcode-expiring-default-rtdb.firebaseio.com",
  projectId: "mcode-expiring",
  storageBucket: "mcode-expiring.firebasestorage.app",
  messagingSenderId: "755995268786",
  appId: "1:755995268786:web:d961cf7836f51a0c0e9bab",
  measurementId: "G-6TRLRCVLJM"
};

/* ===============================
   INITIALIZE FIREBASE
================================ */
const app = initializeApp(firebaseConfig);
getAnalytics(app);
const auth = getAuth(app);
const db = getDatabase(app);

/* ===============================
   ELEMENTS
================================ */
const stockForm = document.getElementById("stockForm");
const nameInput = document.getElementById("name");
const qtyInput = document.getElementById("qty");
const batchInput = document.getElementById("batch");
const expiryInput = document.getElementById("expiry");
const successMsg = document.getElementById("successMsg");

const cards = document.getElementById("cards");
const empty = document.getElementById("empty");
const totalEl = document.getElementById("totalStocks");
const nearEl = document.getElementById("nearExpiry");
const expiredEl = document.getElementById("expired");
const searchInput = document.getElementById("searchInput");
const nearDaysInput = document.getElementById("nearDaysInput");
const alertSound = document.getElementById("alertSound");

/* ===============================
   STATE
================================ */
let currentUser = null;
let stocksRef = null;
let thresholdRef = null;
let allStocks = {};
let thresholdDays = 7;
let lastAlertKey = "";

/* ===============================
   AUTH + AUTO USER CREATION + SUBSCRIPTION CHECK
================================ */
onAuthStateChanged(auth, async user => {
  if (!user) {
    alert("Please login first");
    window.location.href = "firebase login.html";
    return;
  }
  
  currentUser = user;
  const uid = user.uid;
  const userRef = ref(db, `users/${uid}`);
  
  // 🔥 AUTO-CREATE USER RECORD
  const snap = await get(userRef);
  if (!snap.exists()) {
    await update(userRef, {
      email: user.email,
      role: "merchant",
      status: "active",
      createdAt: Date.now(),
      settings: {
        thresholdDays: 7,
        expiryStocks: {}
      }
    });
  }
  
  // ===== SUBSCRIPTION CHECK =====
  const subRef = ref(db, `users/${user.email.replace('.', '_')}/subscription`);
  onValue(subRef, snap => {
    const sub = snap.val();
    if (!sub || sub.status !== 'active') {
      alert("Your subscription expired. Please pay to continue.");
      auth.signOut(); // auto logout
      window.location.href = "firebase login.html";
    }
  });
  
  // ===== THRESHOLD & STOCKS =====
  thresholdRef = ref(db, `users/${uid}/settings/thresholdDays`);
  stocksRef = ref(db, `users/${uid}/settings/expiryStocks`);
  
  // Listen threshold
  onValue(thresholdRef, s => {
    if (s.exists()) {
      thresholdDays = Number(s.val());
      nearDaysInput.value = thresholdDays;
      renderStocks();
    }
  });
  
  // Listen stocks
  onValue(stocksRef, s => {
    allStocks = s.val() || {};
    renderStocks();
  });
});
/* ===============================
   ADD STOCK
================================ */
stockForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (!stocksRef) return;

  const stock = {
    name: nameInput.value.trim(),
    qty: Number(qtyInput.value),
    batch: batchInput.value.trim() || "-",
    expiry: expiryInput.value,
    handled: false,
    createdAt: Date.now()
  };

  await push(stocksRef, stock);
  stockForm.reset();
  successMsg.classList.remove("hidden");
  setTimeout(() => successMsg.classList.add("hidden"), 2000);
});

/* ===============================
   THRESHOLD CHANGE
================================ */
nearDaysInput.addEventListener("change", () => {
  const val = Number(nearDaysInput.value);
  if (isNaN(val) || val < 0) return;
  thresholdDays = val;
  update(ref(db, `users/${currentUser.uid}/settings`), {
    thresholdDays: val
  });
});

/* ===============================
   RENDER STOCKS
================================ */
function renderStocks() {
  cards.innerHTML = "";
  let total = 0, near = 0, expired = 0;

  const today = new Date();
  today.setHours(0,0,0,0);

  const filter = searchInput.value.toLowerCase();
  const entries = Object.entries(allStocks);

  if (!entries.length) {
    empty.classList.remove("hidden");
    totalEl.textContent = nearEl.textContent = expiredEl.textContent = "0";
    updateChart(0,0,0);
    return;
  }

  empty.classList.add("hidden");
  let shouldAlert = false;

  entries.forEach(([id, s]) => {
    if (!s || (filter && !s.name.toLowerCase().includes(filter))) return;

    total++;
    const exp = new Date(s.expiry);
    exp.setHours(0,0,0,0);
    const diff = Math.ceil((exp - today) / 86400000);

    let status = "OK", color = "border-gray-300";
    if (diff < 0) { status = "EXPIRED"; color = "border-red-500"; expired++; shouldAlert = true; }
    else if (diff <= thresholdDays) { status = "NEAR EXPIRY"; color = "border-yellow-500"; near++; shouldAlert = true; }

    const card = document.createElement("div");
    card.className = `bg-white border-l-4 ${color} p-5 rounded shadow`;

    card.innerHTML = `
      <table class="w-full text-sm">
        <tr><td class="font-semibold">Stock</td><td>${s.name}</td></tr>
        <tr><td class="font-semibold">Qty</td><td>${s.qty}</td></tr>
        <tr><td class="font-semibold">Batch</td><td>${s.batch}</td></tr>
        <tr><td class="font-semibold">Expiry</td><td>${s.expiry}</td></tr>
        <tr><td class="font-semibold">Status</td><td class="font-bold">${status}</td></tr>
      </table>
    `;

    const actions = document.createElement("div");
    actions.className = "mt-4 grid grid-cols-2 gap-2";

    const markBtn = document.createElement("button");
    markBtn.textContent = s.handled ? "Unmark" : "Mark Handled";
    markBtn.className = s.handled ? "bg-gray-400 text-white py-1 rounded" : "bg-green-600 text-white py-1 rounded";
    markBtn.onclick = () =>
      update(ref(db, `users/${currentUser.uid}/settings/expiryStocks/${id}`), {
        handled: !s.handled
      });

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";
    delBtn.className = "bg-red-700 text-white py-1 rounded";
    delBtn.onclick = () =>
      confirm("Delete this stock?") &&
      remove(ref(db, `users/${currentUser.uid}/settings/expiryStocks/${id}`));

    actions.append(markBtn, delBtn);
    card.appendChild(actions);
    cards.appendChild(card);
  });

  totalEl.textContent = total;
  nearEl.textContent = near;
  expiredEl.textContent = expired;

  const alertKey = `${near}-${expired}`;
  if (shouldAlert && alertKey !== lastAlertKey) {
    alertSound.currentTime = 0;
    alertSound.play().catch(()=>{});
    lastAlertKey = alertKey;
  }

  updateChart(total, near, expired);
}

/* ===============================
   SEARCH
================================ */
searchInput.addEventListener("input", renderStocks);

/* ===============================
   CHART
================================ */
const ctx = document.getElementById("stockChart").getContext("2d");
let stockChart = null;

function updateChart(total, near, expired) {
  if (!stockChart) {
    stockChart = new Chart(ctx, {
      type: "doughnut",
      data: {
        labels: ["Total", "Near Expiry", "Expired"],
        datasets: [{
          data: [total, near, expired],
          backgroundColor: ["#16a34a", "#facc15", "#dc2626"]
        }]
      },
      options: { responsive: true }
    });
  } else {
    stockChart.data.datasets[0].data = [total, near, expired];
    stockChart.update();
  }
}
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.remove("hidden");
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.classList.add("hidden");
});
const offlineBanner = document.getElementById("offlineBanner");

function updateOnlineStatus() {
if (!navigator.onLine) {
offlineBanner.classList.remove("hidden");
} else {
offlineBanner.classList.add("hidden");
}
}

window.addEventListener("online", updateOnlineStatus);
window.addEventListener("offline", updateOnlineStatus);
updateOnlineStatus();

// --- SERVICE WORKER REGISTRATION ---
if ("serviceWorker" in navigator) {
window.addEventListener("load", () => {
navigator.serviceWorker.register("service-worker.js")
.then(() => console.log("Service Worker Registered"))
.catch(err => console.error("SW failed", err));
});
}

// --- PAYSTACK SUBSCRIPTION ---
const subscribeBtn = document.getElementById('subscribeBtn');

subscribeBtn.addEventListener('click', () => {
const handler = PaystackPop.setup({
key: "pk_live_258fa9605c51c7f7a1f5c20e0254ddf80671d878", // Replace with your Paystack public key
email: "user@example.com", // Replace with current user email
plan: "PLN_gtevyquns1w3oyp", // Replace with your Paystack plan code
callback: function(response) {
alert('Payment successful. Reference: ' + response.reference);
// Optionally refresh subscription status
location.reload();
},
onClose: function() {
alert('Subscription cancelled.');
}
});
handler.openIframe();
});

</script>

<!-- PAYSTACK INLINE SCRIPT -->
<script src="https://js.paystack.co/v1/inline.js">
</script>
</body>
